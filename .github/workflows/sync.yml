name: sync

# Publishes the wheels of the latest successful build of the branch `develop`
# of sys-bio/roadrunner as a release of this repository, writes the package
# index of all releases to GitHub Pages and, as the last step, installs the
# published build from the index with uv and with pip on python 3.14 and 3.15
# on every platform and simulates with it.
on:
  schedule:
    # daily, after the builds of the night
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "The id of a run of BuildRoadRunner to publish instead of the latest"
        required: false
        default: ""
  push:
    branches: [main]

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Publish the wheels of the latest build of develop
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ inputs.run }}
      run: python3 sync.py publish ${RUN:+--run "$RUN"}

  pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Write the package index of the releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 sync.py index --out site
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v5

  check:
    # the published build from the index, as a user installs it (README):
    # `uv sync` of a project with the source and `pip install
    # --extra-index-url`, on the pythons of uv; the installed version must be
    # the published one, so the index serves the newest build
    name: check (${{ matrix.os }}, python ${{ matrix.python }}, ${{ matrix.installer }})
    needs: [publish, pages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.14", "3.15"]
        installer: [uv, pip]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    # astral-sh/setup-uv publishes no floating major tag beyond v7
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false
    - name: Install the published build and simulate
      env:
        VERSION: ${{ needs.publish.outputs.version }}
        INSTALLER: ${{ matrix.installer }}
        PYTHON: ${{ matrix.python }}
      # GitHub Pages caches its pages for up to ten minutes
      run: >-
        uv run --no-project --python 3.14 check_install.py
        --installer "$INSTALLER" --python "$PYTHON" --version "$VERSION" --wait 900
      shell: bash
